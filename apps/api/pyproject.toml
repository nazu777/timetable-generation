[project]
name = "timetable-api"
version = "0.1.0"
description = "FastAPI backend for timetable generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "black>=24.0",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
