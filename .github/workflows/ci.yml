name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @timetable/web typecheck
      - run: pnpm --filter @timetable/web lint
      - run: pnpm --filter @timetable/web build

  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ./packages/solver[dev,ortools]
      - run: pytest -q packages/solver

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timetable
          POSTGRES_PASSWORD: timetable
          POSTGRES_DB: timetable
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U timetable"
          --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://timetable:timetable@localhost:5432/timetable
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ./apps/api[dev] -e ./packages/solver
      - run: ruff check apps/api/app apps/api/tests
      - run: pytest -q apps/api
